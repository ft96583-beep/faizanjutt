<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

<h1><i class="fas fa-user-shield"></i> Portfolio Admin Panel</h1>

<div class="card">

<h2>Hero Section</h2>

<input
type="text"
id="heroName"
placeholder="Name">

<input
type="text"
id="heroTitle"
placeholder="Title">

<textarea
id="heroDesc"
placeholder="Description"></textarea>

<button class="save-btn" id="saveHero">
Save Hero
</button>

</div>

<div class="card">

<h2>About Section</h2>

<textarea
id="aboutText"
placeholder="About Me"></textarea>

<button class="save-btn" id="saveAbout">
Save About
</button>

</div>

<div class="card">

<h2>WhatsApp Number</h2>

<input
type="text"
id="whatsapp"
placeholder="923XXXXXXXXX">

<button class="save-btn" id="saveWhatsapp">
Save WhatsApp
</button>

</div>

<div class="card">

<h2>Logout</h2>

<button class="save-btn" id="logoutBtn">
Logout
</button>

</div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="dashboard.js"></script>

</body>

</html>
